
server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        # =========================
        # USER SERVICE
        # =========================
        - id: user-service
          uri: ${USER_SERVICE_URL}
          order: 0
          predicates:
            - Path=/v1/users/**

        # =========================
        # RESTAURANT SERVICE
        # =========================
        - id: restaurant-service
          uri: ${RESTAURANT_SERVICE_URL}
          order: 0
          predicates:
            - Path=/v1/restaurants/**

        # =========================
        # ORDER SERVICE - CART
        # =========================
        - id: order-service-cart
          uri: ${ORDER_SERVICE_URL}
          order: 0
          predicates:
            - Path=/v1/cart/**

        # =========================
        # TRACKING SERVICE - WEBSOCKET
        # Must come before /v1/orders/**
        # =========================
        - id: tracking-service-ws
          uri: ${TRACKING_SERVICE_URL}
          order: -1
          predicates:
            - Path=/v1/orders/*/track

        # =========================
        # ORDER SERVICE - ORDERS
        # =========================
        - id: order-service-orders
          uri: ${ORDER_SERVICE_URL}
          order: 0
          predicates:
            - Path=/v1/orders/**

        # =========================
        # TRACKING SERVICE
        # =========================
        - id: tracking-service
          uri: ${TRACKING_SERVICE_URL}
          order: 0
          predicates:
            - Path=/v1/delivery/**

        # =========================
        # DELIVERY SERVICE
        # =========================
        - id: delivery-service
          uri: ${DELIVERY_SERVICE_URL}
          order: 0
          predicates:
            - Path=/v1/delivery-partners/**

        # =========================
        # PAYMENT SERVICE
        # =========================
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL}
          order: 0
          predicates:
            - Path=/v1/payments/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true

