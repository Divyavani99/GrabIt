
server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        # =========================
        # USER SERVICE
        # =========================
        - id: user-service
          uri: https://user-service.onrender.com
          order: 0
          predicates:
            - Path=/v1/users/**

        # =========================
        # RESTAURANT SERVICE
        # =========================
        - id: restaurant-service
          uri: https://restaurant-service-420f.onrender.com
          order: 0
          predicates:
            - Path=/v1/restaurants/**

        # =========================
        # ORDER SERVICE - CART
        # =========================
        - id: order-service-cart
          uri: https://YOUR-ORDER-SERVICE.onrender.com
          order: 0
          predicates:
            - Path=/v1/cart/**

        # =========================
        # TRACKING SERVICE - WEBSOCKET
        # =========================
        - id: tracking-service-ws
          uri: https://YOUR-TRACKING-SERVICE.onrender.com
          order: -1
          predicates:
            - Path=/v1/orders/*/track

        # =========================
        # ORDER SERVICE - ORDERS
        # =========================
        - id: order-service-orders
          uri: https://YOUR-ORDER-SERVICE.onrender.com
          order: 0
          predicates:
            - Path=/v1/orders/**

        # =========================
        # TRACKING SERVICE
        # =========================
        - id: tracking-service
          uri: https://YOUR-TRACKING-SERVICE.onrender.com
          order: 0
          predicates:
            - Path=/v1/delivery/**

        # =========================
        # DELIVERY SERVICE
        # =========================
        - id: delivery-service
          uri: https://YOUR-DELIVERY-SERVICE.onrender.com
          order: 0
          predicates:
            - Path=/v1/delivery-partners/**

        # =========================
        # PAYMENT SERVICE
        # =========================
        - id: payment-service
          uri: https://YOUR-PAYMENT-SERVICE.onrender.com
          order: 0
          predicates:
            - Path=/v1/payments/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true

