server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://user-service
          order: 0
          predicates:
            - Path=/v1/users/**

        - id: restaurant-service
          uri: lb://restaurant-service
          order: 0
          predicates:
            - Path=/v1/restaurants/**

        - id: order-service-cart
          uri: lb://order-service
          order: 0
          predicates:
            - Path=/v1/cart/**

        # Must be evaluated before order-service-orders below: the WebSocket path
        # /v1/orders/{orderId}/track also matches /v1/orders/**, but belongs to
        # tracking-service, not order-service. Lower "order" = higher priority.
        - id: tracking-service-ws
          uri: lb://tracking-service
          order: -1
          predicates:
            - Path=/v1/orders/*/track

        - id: order-service-orders
          uri: lb://order-service
          order: 0
          predicates:
            - Path=/v1/orders/**

        - id: tracking-service
          uri: lb://tracking-service
          order: 0
          predicates:
            - Path=/v1/delivery/**

        - id: delivery-service
          uri: lb://delivery-service
          order: 0
          predicates:
            - Path=/v1/delivery-partners/**

        - id: payment-service
          uri: lb://payment-service
          order: 0
          predicates:
            - Path=/v1/payments/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
