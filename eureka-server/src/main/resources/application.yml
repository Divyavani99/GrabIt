server:
  port: ${PORT:8761}

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: eureka-fn2q.onrender.com

  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: https://eureka-fn2q.onrender.com/eureka/

  server:
    enable-self-preservation: false
