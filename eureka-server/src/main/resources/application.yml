server:
  port: ${PORT:8761}

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: eureka-fn2q.onrender.com

  client:
    register-with-eureka: false
    fetch-registry: false

  server:
    enable-self-preservation: false
    peer-eureka-nodes-update-interval-ms: 600000
